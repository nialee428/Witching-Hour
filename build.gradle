plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id("com.github.johnrengelman.shadow") version "8.1.1"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { name = "Ladysnake Mods"; url = 'https://maven.ladysnake.org/releases' }
    maven { name = "BlameJared Maven"; url = "https://maven.blamejared.com" }
}

fabricApi {
    configureDataGeneration { client = true }
}

dependencies {
    implementation 'com.alphacephei:vosk:0.3.45'
    implementation 'net.java.dev.jna:jna:5.7.0'
    implementation 'org.apache.opennlp:opennlp-tools:2.5.4'

    // Minecraft 26.3 is unobfuscated; use Mojang's names and ordinary configurations.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // These third-party mods must have 26.3-compatible releases before they can be enabled.
    // modImplementation "com.github.Virtuoel:Pehkui:<26.3-compatible-version>"
    // modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:<26.3-compatible-version>"
    // modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:<26.3-compatible-version>"
    // modImplementation "vazkii.patchouli:Patchouli:<26.3-compatible-version>"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") { rename { "${it}_${inputs.properties.archivesName}" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories { }
}